services:
  backend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_USER=admin
      - DB_PASSWORD=admin123
      - DB_NAME=food_ordering_db
    networks:
      - app-network

  mysql:
    build: 
      context: .
      dockerfile: Dockerfile.mysql
    image: mysql:8.4  
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=food_ordering_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
